<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>流浪店 Wandering Trader</title>
<link rel="icon" type="image/x-icon" href="https://i.ibb.co/W4xbZzhY/hobo2.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--surface:#fff;--ink:#141b2d;--muted:#5d6678;--line:#d5d9e1;--accent:#2b4eff;--accent-ink:#fff;--danger:#c0352b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#1a2133;--ink:#eef0f6;--muted:#9aa3b8;--line:#2c3550;--accent:#7b93ff;--accent-ink:#0f1420;--danger:#ff7b70}}
:root[data-theme="dark"]{--bg:#0f1420;--surface:#1a2133;--ink:#eef0f6;--muted:#9aa3b8;--line:#2c3550;--accent:#7b93ff;--accent-ink:#0f1420;--danger:#ff7b70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.5}
.zh{display:block;font-size:.82em;font-weight:400;letter-spacing:0;opacity:.72}
.sub{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1rem,3vw,1.5rem);font-weight:500;color:var(--muted);margin-top:0px}
.hint{font-size:.78rem;color:var(--muted);margin:10px 0 0}
h1,h2,h3{font-family:"Bricolage Grotesque","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;margin:0;line-height:1.05}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background-color:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:28px clamp(16px,4vw,48px) 12px;flex-wrap:wrap}
h1{font-size:clamp(2.6rem,9vw,5.5rem);font-weight:800;letter-spacing:-.04em}
header p{margin:6px 0 0;color:var(--muted);max-width:34ch}
.bagbtn{text-align:center;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer}
.login{text-align:center;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer}
main{display:grid;grid-template-rows:auto 1fr;gap:28px;padding:16px clamp(16px,4vw,16px) 16px;align-items:start;grid-auto-flow:column}
section{display:grid;grid-template-columns:auto 80% 10%;gap:28px;padding:16px clamp(16px,4vw,48px) 56px;align-items:start;grid-auto-flow:row}
h7{display:grid;gap:8px;padding:8px clamp(8px,4vw,8px) 8px;align-items:center;grid-auto-flow:row}
h8{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px clamp(16px,4vw,48px) 12px;flex-wrap:wrap}
h9{display: block; margin-left: auto; margin-right: 0;}
h10{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px clamp(16px,4vw,48px) 12px;flex-wrap:wrap}
h11{display: flex; justify-content: flex-start;align-items:center}
h12{display: flex; justify-content: flex-end;}
header2{display:flex;align-items:flex-end;justify-content:space-between;gap:0px;padding:3px;flex-wrap:wrap}

.buttonyes{align-items:center;width: 25px;height: 25px;border:1px solid var(--ink);background:transparent;border-radius:8px;cursor:pointer}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;position:sticky;top:12px}
@media (max-width:820px){.panel{position:static}}
.panel h2{font-size:1.5rem;margin-bottom:14px}
label{display:block;font-weight:500;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input[type=color]{width:48px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
input[type=file]{font-size:.85rem;width:100%}
.row{display:flex;gap:10px}.row>*{flex:1}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes label{margin:0;font-weight:500}
.sizes input{position:absolute;opacity:0}
.sizes span{display:inline-block;min-width:40px;text-align:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.sizes input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sizes input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.primary{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:8px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;flex-direction:column}
.bar2{display:flex;flex-wrap:wrap;flex-direction:column}
.chip{padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/5;display:flex;align-items:flex-end;padding:12px;background-size:cover;background-position:center;position:relative}
.thumb b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;color:#fff;mix-blend-mode:difference;letter-spacing:-.02em}
.del{position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:30px;height:30px;background:var(--surface);cursor:pointer;font-size:1rem;line-height:1}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:1.1rem}
.meta{color:var(--muted);font-size:.85rem}
.price{font-weight:700;margin-top:auto;padding-top:6px}
.add{margin-top:8px;padding:9px;border:1px solid var(--ink);background:transparent;border-radius:8px;font-weight:700;cursor:pointer}
.add:hover{background:var(--ink);color:var(--bg)}
.search input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin-bottom:12px}
.badge{position:absolute;top:8px;left:8px;background:var(--danger);color:var(--bg);font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px}
.old{opacity:.6;font-weight:400}
.saleRow{display:flex;gap:6px;margin-top:8px}
.saleRow input{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.saleRow .add{margin-top:0;flex:1;padding:6px}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line button{border:0;background:none;color:var(--danger);cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:700;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div style="display: flex; align-items: left; gap: 16px;">
    <img src="https://i.ibb.co/W4xbZzhY/hobo2.png" alt="A gray cat sleeping on a couch" width="100" height="100">
    <div class="bar2"><h1>流浪店</h1><div class="sub">Wandering Trader</div></div>
    <!--p>Hobos are stylish too.<span class="zh">原来流浪汉也很有型。</span></p-->
  </div>
  <div>
  <button class="bagbtn" id="bagBtn" type="button">Bag (0)</button>
  <button class="login" id="login" type="button">Log in<span class="zh">登录</span></button>
  </div>
</header>

<main>
  <section aria-label="Shop 商店" style="position:relative">
    <main>
    <div class="search"><input type="search" id="search" placeholder="Search items… 搜索商品…" aria-label="Search the catalog 搜索商品目录"></div>
    <div class="bar" id="filters" role="group" aria-label="Filter by category 按分类筛选"></div>
    </main>
    <h7 class="grid" id="grid"></h7>
  </section>
  <div class="panel" aria-labelledby="addTitle" style="display:none;position:relative" id="additemthing">
    <h2 id="addTitle">Add an item<span class="zh">添加商品</span></h2>
    <div>
      <label for="name">Item name<span class="zh">商品名称</span></label>
      <input type="text" id="name" placeholder="Linen overshirt" maxlength="60">
      <label for="zhname">Chinese name (optional)<span class="zh">中文名称（可选）</span></label>
      <input type="text" id="zhname" placeholder="亚麻衬衫外套" maxlength="40">
      <div class="row">
        <div><label for="price">Price (USD)<span class="zh">价格（美元）</span></label><input type="number" id="price" min="0" step="0.01" placeholder="64.00"></div>
        <div><label for="cat">Category<span class="zh">分类</span></label>
          <select id="cat"><option value="Tops">Tops / 上衣</option><option value="Bottoms">Bottoms / 裤装</option><option value="Outerwear">Outerwear / 外套</option><option value="Shoes">Shoes / 鞋履</option><option value="Accessories">Accessories / 配饰</option></select></div>
      </div>
      <label>Sizes<span class="zh">尺码</span></label>
      <div class="sizes" id="sizes"></div>
      <label for="disc">Discount % (optional)<span class="zh">折扣百分比（可选）</span></label>
      <input type="number" id="disc" min="0" max="90" step="1" placeholder="20">
      <div class="row" style="align-items:end">
        <div style="flex:0 0 auto"><label for="color">Color<span class="zh">颜色</span></label><input type="color" id="color" value="#2b4eff"></div>
        <div><label for="photo">Photo (optional)<span class="zh">照片（可选）</span></label><input type="file" id="photo" accept="image/*"></div>
      </div>
      <button class="primary" id="addItem" type="button">Add to shop<span class="zh">上架商品</span></button>
      <p class="err" id="err" role="alert"></p>
      <p class="hint">Yuan shown at ¥6.67 = $1.<span class="zh">人民币按 ¥6.67 = $1 换算。</span></p>
    </div>
  </div>
</main>

<dialog id="bagDlg">
  <h2 style="font-size:1.5rem;margin-bottom:10px">Your bag<span class="zh">购物袋</span></h2>
  <div id="bagList"></div>
  <div class="total"><span>Total<span class="zh">总计</span></span><span id="bagTotal" style="text-align:right"></span></div>
  <div class="row"><button id="clearBag" type="button">Empty bag<span class="zh">清空</span></button><button class="add" id="closeBag" type="button">Keep shopping<span class="zh">继续逛</span></button></div>
</dialog>

<dialog id="loginlog">
  <header2>
    <div style="display: flex; align-items: left; gap: 0px;">
    <div class="bar2"><h2>Log In</h2></div>
    </div>

    <button class="buttonyes" id="closeBag2" type="button"><img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Transparent_X.png" width="10px" height="10px" style="display: flex; justify-content: center;align-items: center;display:block;"></button>

  </header2>
  <label for="user">User</label>
      <input type="text" id="user" placeholder="User" maxlength="60">
  <label for="pass">Password</label>
      <input type="text" id="pass" placeholder="Pass" maxlength="60">
  <div id="bagList"></div>
  <div class="row"><button class="add" id="loginenter" type="button">Log In</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var CATS=["All","Tops","Bottoms","Outerwear","Shoes","Accessories"], SIZES=["XS","S","M","L","XL","One size"],ZC={All:"全部",Tops:"上衣",Bottoms:"裤装",Outerwear:"外套",Shoes:"鞋履",Accessories:"配饰"},RATE=6.67;
var seed=[
 {id:1,name:"Yino outfit",zh:"厚棉T恤",price:28,cat:"Tops",sizes:["S","M","L","XL"],color:"#d8d2c4",photo:"https://i.ibb.co/nsKx2cX9/Image-5-D1-C6762-1217-4-BC2-B110-355-C43260979.jpg"},
 {id:2,name:"Justin outfit",zh:"直筒休闲裤",price:68,cat:"Bottoms",sizes:["S","M","L"],color:"#33415c",photo:"https://i.ibb.co/Q74F0RQM/Image-79-FC88-E1-CB34-4299-B0-B5-F86-CD567659-C.jpg"},
 {id:3,name:"Jeremy outfit",zh:"蜡面野外夹克",sale:20,price:149,cat:"Outerwear",sizes:["M","L","XL"],color:"#5a6b3f",photo:"https://i.ibb.co/9HwHqmSZ/Image-E5252126-F26-B-492-B-B37-E-5-BE4030-A4052.jpg"},
 {id:4,name:"Carter outfit",zh:"帆布低帮鞋",price:55,cat:"Shoes",sizes:["M","L"],color:"#e6e8ee",photo:"https://i.ibb.co/G42Bv2m3/Image-503406-FA-D2-CA-48-DD-BCF7-DDE35-EA93-C0-C.jpg"},
 {id:5,name:"Yoyo joutfit",zh:"帆布低帮鞋",price:55,cat:"Shoes",sizes:["M","L"],color:"#e6e8ee",photo:"https://i.ibb.co/tw9dPwqW/Image-7-C5-E6-B47-E82-C-46-CA-81-A2-EC49-B939-E900.jpg"}];
var items=load("loom-items",seed), bag=load("loom-bag",[]), filter="All", q="", nextId=Date.now(), photoData="";
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Couldn’t save – the photo may be too large.","无法保存，照片可能过大。")}}
var $=function(id){return document.getElementById(id)};
function money(n){return "$"+Number(n).toFixed(2)}
function eff(i){return i.sale?i.price*(1-i.sale/100):i.price}
function priceHtml(i){return i.sale?'<span class="price"><s class="old">'+money(i.price)+"</s> "+money(eff(i))+'<span class="zh"><s class="old">'+cny(i.price)+"</s> "+cny(eff(i))+"</span></span>":'<span class="price">'+money(i.price)+'<span class="zh">'+cny(i.price)+"</span></span>"}
function cny(n){return "¥"+(Number(n)*RATE).toFixed(2)}
function zs(a){return a.map(function(x){return x==="One size"?"均码":x}).join(", ")}
function toast(m,z){var t=$("toast");t.innerHTML=esc(m)+(z?'<span class="zh">'+esc(z)+"</span>":"");t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2000)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

$("sizes").innerHTML=SIZES.map(function(s){return '<label><input type="checkbox" value="'+s+'"><span>'+s+(s==="One size"?'<span class="zh">均码</span>':'')+'</span></label>'}).join("");

function renderFilters(){
  $("filters").innerHTML=CATS.map(function(c){return '<button type="button" class="chip" data-c="'+c+'" aria-pressed="'+(c===filter)+'">'+c+'<span class="zh">'+ZC[c]+'</span></button>'}).join("");
}
function render(){
  renderFilters();
  var qq=q.toLowerCase();var list=items.filter(function(i){return (filter==="All"||i.cat===filter)&&(!qq||[i.name,i.zh||"",i.cat,ZC[i.cat]].join(" ").toLowerCase().indexOf(qq)>-1)});
  $("grid").innerHTML=list.length?list.map(function(i){
    var bg=i.photo?'background-image:url('+i.photo+')':'background:'+esc(i.color);
    return '<article class="card"><div class="thumb" style="'+bg+'">'+(i.photo?'':'<b>'+esc(i.name.charAt(0).toUpperCase())+'</b>')+
      (i.sale?'<span class="badge">-'+i.sale+'%</span>':'')+'<button class="del" type="button" data-del="'+i.id+'" aria-label="Remove 移除 '+esc(i.name)+'">×</button></div>'+
      '<div class="info"><h3>'+esc(i.name)+(i.zh?'<span class="zh">'+esc(i.zh)+'</span>':'')+
      '</h3><span class="meta">'+esc(i.cat)+' · '+esc(i.sizes.join(", ")||"One size")+
      '<span class="zh">'+ZC[i.cat]+' · '+zs(i.sizes.length?i.sizes:["One size"])+
      '</span></span>'+
      priceHtml(i)+
      '<button class="add" type="button" data-add="'+
      i.id+
      'loggedin === 0 ? ">Add to bag<span class="zh">加入购物袋</span></button><div class="saleRow" id = "salerow" style="display:none"><input type="number" min="0" max="90" placeholder="% off" aria-label="Discount percent 折扣百分比" data-s=" : ">Add to bag<span class="zh">加入购物袋</span></button><div class="saleRow" id = "salerow" style="display:inline"><input type="number" min="0" max="90" placeholder="% off" aria-label="Discount percent 折扣百分比" data-s="' +
//      '">Add to bag<span class="zh">加入购物袋</span></button><div class="saleRow" id = "salerow" style="display:none"><input type="number" min="0" max="90" placeholder="% off" aria-label="Discount percent 折扣百分比" data-s="'+
      i.id+
      '"><button type="button" class="add" data-setsale="'+
      i.id+
      '">Set sale<span class="zh">设置促销</span></button></div></div></article>';
  }).join(""):(q?'<div class="empty">No items match “'+esc(q)+'”.<span class="zh">没有找到匹配“'+esc(q)+'”的商品。</span></div>':'<div class="empty">Nothing in '+esc(filter)+' yet. Use the form to add your first item.<span class="zh">“'+ZC[filter]+'”暂无商品，请用表单添加第一件商品。</span></div>');
  $("bagBtn").innerHTML="Bag ("+bag.length+')<span class="zh">购物袋（'+bag.length+"）</span>";
}
function renderBag(){
  $("bagList").innerHTML=bag.length?bag.map(function(b,n){return '<div class="line"><span>'+esc(b.name)+(b.zh?'<span class="zh">'+esc(b.zh)+'</span>':'')+'</span><span style="text-align:right">'+money(b.price)+'<span class="zh">'+cny(b.price)+'</span><button type="button" data-rm="'+n+'" aria-label="Remove from bag 移出购物袋">Remove 移除</button></span></div>'}).join(""):'<p class="meta">Your bag is empty.<span class="zh">购物袋是空的。</span></p>';
  var tt=bag.reduce(function(s,b){return s+b.price},0);$("bagTotal").innerHTML=money(tt)+'<span class="zh">'+cny(tt)+"</span>";
}

$("filters").addEventListener("click",function(e){var cb=e.target.closest("[data-c]"),c=cb?cb.getAttribute("data-c"):null;if(c){filter=c;render()}});
$("grid").addEventListener("click",function(e){
  var el=function(k){var x=e.target.closest("["+k+"]");return x?x.getAttribute(k):null};
  var a=el("data-add"),d=el("data-del"),ss=el("data-setsale");
  if(ss){var v=parseFloat(document.querySelector('input[data-s="'+ss+'"]').value);
    if(isNaN(v)||v<0||v>90){toast("Enter a discount from 0 to 90.","请输入 0 到 90 的折扣。");return}
    items.find(function(i){return i.id==ss}).sale=v;save("loom-items",items);render();
    toast(v?"Sale set: "+v+"% off":"Sale removed",v?"已设置促销："+v+"% 折扣":"已取消促销");return}
  if(a){var it=items.find(function(i){return i.id==a});bag.push({name:it.name,zh:it.zh,price:eff(it)});save("loom-bag",bag);render();toast("Added “"+it.name+"” to your bag","已将“"+(it.zh||it.name)+"”加入购物袋")}
  if(d){items=items.filter(function(i){return i.id!=d});save("loom-items",items);render();toast("Item removed","商品已移除")}
});
$("search").addEventListener("input",function(e){q=e.target.value.trim();render()});
$("bagBtn").onclick=function(){renderBag();$("bagDlg").showModal()};
$("login").onclick=function(){renderBag();$("loginlog").showModal()};
$("closeBag").onclick=function(){$("bagDlg").close()};
$("closeBag2").onclick=function(){$("loginlog").close()};
$("clearBag").onclick=function(){bag=[];save("loom-bag",bag);renderBag();render()};
$("bagList").addEventListener("click",function(e){var n=e.target.getAttribute("data-rm");if(n!==null){bag.splice(+n,1);save("loom-bag",bag);renderBag();render()}});

$("photo").addEventListener("change",function(e){
  var f=e.target.files[0];photoData="";if(!f)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",.78)};im.src=r.result};r.readAsDataURL(f);
});

$("addItem").onclick=function(){
  var name=$("name").value.trim(),price=parseFloat($("price").value);
  if(!name){$("err").innerHTML="Enter an item name.<span class=\"zh\">请输入商品名称。</span>";$("name").focus();return}
  if(isNaN(price)||price<0){$("err").innerHTML="Enter a price of $0 or more.<span class=\"zh\">请输入不小于 $0 的价格。</span>";$("price").focus();return}
  $("err").textContent="";
  var sz=Array.prototype.map.call(document.querySelectorAll("#sizes input:checked"),function(x){return x.value});
  items.unshift({id:nextId++,name:name,zh:$("zhname").value.trim(),sale:Math.min(90,Math.max(0,parseFloat($("disc").value)||0)),price:price,cat:$("cat").value,sizes:sz,color:$("color").value,photo:photoData});
  save("loom-items",items);
  $("name").value="";$("zhname").value="";$("disc").value="";$("price").value="";$("photo").value="";photoData="";
  document.querySelectorAll("#sizes input").forEach(function(x){x.checked=false});
  filter="All";q="";$("search").value="";render();toast("“"+name+"” added to the shop","“"+(items[0].zh||name)+"”已上架");
};

    });

};
loggedin=0;


render();
